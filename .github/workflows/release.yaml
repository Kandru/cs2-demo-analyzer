name: Build Release

# Bump VERSION (YY.MM.BuildNr) and push to main to cut a release.
on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: cs2-demo-analyzer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$'; then
            echo "::error::VERSION must look like YY.MM.BuildNr (e.g. 26.11.1), got '$version'"
            exit 1
          fi

          expected_month="$(date -u +%y.%m)"
          actual_month="${version%.*}"
          if [ "$actual_month" != "$expected_month" ]; then
            echo "::error::VERSION month is $actual_month but the current UTC month is $expected_month. BuildNr resets to 1 on the first of each month."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::notice::tag $version already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release archives (Docker)
        if: steps.version.outputs.release == 'true'
        run: make release

      - name: Generate release notes
        if: steps.version.outputs.release == 'true'
        id: notes
        run: |
          set -eu
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            last_tag="$(git describe --tags --abbrev=0 HEAD^)"
          else
            last_tag="$(git rev-list --max-parents=0 HEAD)"
          fi
          {
            echo "## Changes since $last_tag"
            echo
            git log --pretty=format:'- [%h](https://github.com/${{ github.repository }}/commit/%H) %s (%an)' "$last_tag"..HEAD
            echo
            echo
            echo "## Artifacts"
            echo
            echo "Self-contained binaries for Linux, Windows and macOS (amd64/arm64, plus linux/386)."
            echo "Verify downloads with \`SHA256SUMS\`."
          } > release_notes.md
          echo "path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --target "${{ github.sha }}"

      - name: Delete old releases (keep last 5)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          releases="$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName')"
          for tag in $releases; do
            echo "deleting old release $tag"
            gh release delete "$tag" --yes
          done
